<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>글쓰기 - IOCP 게시판</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="container"><div class="card">
<h2>글쓰기</h2>
<form method="post" action="/write">
<div class="form-group"><label for="title">제목</label>
<input type="text" id="title" name="title" required></div>
<div class="form-group"><label for="content">내용</label>
<textarea id="content" name="content" rows="10" required></textarea></div>
<div class="form-actions"><a href="/board" class="btn-secondary">취소</a>
<button type="submit" class="btn">작성</button></div>
</form></div></div></body></html>
