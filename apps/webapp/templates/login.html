<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>로그인 - IOCP 게시판</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="container">
<h1>IOCP 게시판</h1>
<div class="card"><h2>로그인</h2>
{{error}}
<form method="post" action="/login">
<div class="form-group"><label for="username">아이디</label>
<input type="text" id="username" name="username" required></div>
<div class="form-group"><label for="password">비밀번호</label>
<input type="password" id="password" name="password" required></div>
<button type="submit" class="btn">로그인</button></form>
<p class="hint">테스트 계정: admin / admin123  또는  user / pass123</p>
</div></div></body></html>
